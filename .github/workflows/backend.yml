name: Backend CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Backend/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Backend/**'

jobs:
  build-backend:
    name: Build Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./Backend
        run: mvn clean package -DskipTests


